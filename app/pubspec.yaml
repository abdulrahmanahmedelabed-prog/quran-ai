name: quran_ai
description: "Quran recitation companion with AI mistake detection"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  record: ^7.1.1
  web_socket_channel: ^3.0.3
  shared_preferences: ^2.5.5
  just_audio: ^0.10.6
  path_provider: ^2.1.6
  http: ^1.6.0
  whisper_ggml: ^2.6.0
  in_app_purchase: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/quran/quran_uthmani.json

  fonts:
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/AmiriQuran.ttf
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
