name: Recognition model

# Converts the Quran fine-tuned Whisper model to ggml for whisper.cpp,
# quantizes it (smaller and faster on phones), checks that whisper.cpp loads
# it and transcribes a recited ayah, and publishes it as the release the app
# downloads on first use (ModelManager.quranModelUrl in
# app/lib/asr/on_device_engine.dart). A fixed model gets a new tag, since
# phones keep the file of a URL they already downloaded.
on:
  workflow_dispatch:
    inputs:
      model:
        description: "Hugging Face model id"
        default: "tarteel-ai/whisper-base-ar-quran"
      tag:
        description: "Release tag to publish (new tag for a changed model)"
        default: "model-v2"

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    env:
      MODEL_ID: ${{ inputs.model || 'tarteel-ai/whisper-base-ar-quran' }}
      TAG: ${{ inputs.tag || 'model-v2' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download and convert
        run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q transformers huggingface_hub numpy
          git clone -q --depth 1 https://github.com/ggml-org/whisper.cpp work/whisper.cpp
          git clone -q --depth 1 https://github.com/openai/whisper work/whisper
          python -c "from huggingface_hub import snapshot_download; snapshot_download('$MODEL_ID', local_dir='work/model')"
          mkdir -p out
          python work/whisper.cpp/models/convert-h5-to-ggml.py work/model work/whisper out
          # The converter writes the generation max_length as n_text_ctx; the
          # decoder's positional embedding has max_target_positions rows, and
          # whisper.cpp refuses to load the model when the two differ.
          python tools/fix_ggml_text_ctx.py out/ggml-model.bin work/model/config.json
          ls -l out
      - name: Quantize to q5_0
        run: |
          cmake -S work/whisper.cpp -B work/build -DCMAKE_BUILD_TYPE=Release > /dev/null
          # The target was renamed whisper-quantize in newer whisper.cpp.
          cmake --build work/build --target whisper-quantize whisper-cli -j 4 > /dev/null \
            || cmake --build work/build --target quantize main -j 4 > /dev/null
          Q=$(find work/build/bin -name '*quantize*' -type f | head -n 1)
          "$Q" out/ggml-model.bin out/ggml-quran-base.bin q5_0
          ls -l out
      - name: Check it loads and recognizes al-Fatiha
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          for a in 001 002 003 004; do
            curl -sSfL -o "a$a.mp3" "https://everyayah.com/data/Husary_128kbps/001$a.mp3"
          done
          ffmpeg -loglevel error -i "concat:a001.mp3|a002.mp3|a003.mp3|a004.mp3" -ar 16000 -ac 1 -c:a pcm_s16le fatiha.wav
          CLI=$(find work/build/bin -type f \( -name whisper-cli -o -name main \) | head -n 1)
          "$CLI" -m out/ggml-quran-base.bin -l ar -nt -f fatiha.wav | tee heard.txt
          python tools/fix_ggml_text_ctx.py --check-heard heard.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" out/ggml-quran-base.bin --clobber
          else
            gh release create "$TAG" out/ggml-quran-base.bin \
              --title "Recognition model $TAG" \
              --notes "Whisper fine-tuned on Quran recitation ($MODEL_ID), converted to ggml and quantized (q5_0). Downloaded by the app on first use."
          fi
