name: Build app

# Android: an installable APK on every push. iOS: an unsigned IPA on demand
# (Actions → Build app → Run workflow), since macOS runners are costly.
on:
  push:
    paths:
      - "app/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:
    inputs:
      ios:
        description: "Also build the iOS IPA (unsigned)"
        type: boolean
        default: true

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # whisper_ggml builds whisper.cpp with this NDK, which the runner lacks.
      - name: Install Android NDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null
          "$SDKM" "ndk;29.0.13113456" > /dev/null
      # Signed with the debug key so it installs directly; set up a release
      # keystore before publishing to Google Play.
      - run: flutter build apk --release
      - run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/quran-ai.apk
      - uses: actions/upload-artifact@v4
        with:
          name: quran-ai-android
          path: app/build/app/outputs/flutter-apk/quran-ai.apk
          retention-days: 30

  ios:
    if: github.event_name == 'workflow_dispatch' && inputs.ios
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Unsigned: install it with a sideloading tool (e.g. Sideloadly or
      # AltStore) using your Apple ID, or sign it for TestFlight.
      - run: flutter build ios --release --no-codesign
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr quran-ai-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: quran-ai-ios-unsigned
          path: app/quran-ai-unsigned.ipa
          retention-days: 30
