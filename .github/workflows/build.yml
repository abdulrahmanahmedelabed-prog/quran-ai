name: Build app

# Android APK and Windows zip on every push. iOS: an unsigned IPA on demand
# (Actions → Build app → Run workflow), since macOS runners are costly.
on:
  push:
    paths:
      - "app/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:
    inputs:
      ios:
        description: "Also build the iOS IPA (unsigned)"
        type: boolean
        default: false
      emulator:
        description: "Run a screen tour on an Android emulator"
        type: boolean
        default: true

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # publishes the APKs to the app-latest release
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # whisper_ggml builds whisper.cpp with this NDK, which the runner lacks.
      - name: Install Android NDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null
          "$SDKM" "ndk;29.0.13113456" > /dev/null
      # One APK per CPU type instead of one holding all of them: arm64 fits
      # most phones since ~2017, armv7 the older 32-bit ones. The AAB is for
      # Google Play, which delivers only what each phone needs.
      # Signed with the debug key so they install directly; set up a release
      # keystore before publishing to Google Play.
      - run: flutter build apk --release --split-per-abi
      - run: flutter build appbundle --release
      - name: Name and measure
        run: |
          cd build/app/outputs
          mkdir -p dist
          mv flutter-apk/app-arm64-v8a-release.apk dist/quran-ai-arm64.apk
          mv flutter-apk/app-armeabi-v7a-release.apk dist/quran-ai-armv7-old-phones.apk
          mv flutter-apk/app-x86_64-release.apk dist/quran-ai-x86_64.apk
          mv bundle/release/app-release.aab dist/quran-ai-google-play.aab
          ls -l dist
          # The largest files inside the arm64 APK, to keep an eye on size.
          unzip -lv dist/quran-ai-arm64.apk | sort -k3 -n -r | head -n 12
      - uses: actions/upload-artifact@v4
        with:
          name: quran-ai-android
          path: app/build/app/outputs/dist/
          retention-days: 30
      # Direct download links for phones (artifacts need a GitHub login and
      # come zipped): the release is replaced with every build.
      - name: Publish the app-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd build/app/outputs/dist
          gh release delete app-latest --yes --cleanup-tag || true
          gh release create app-latest quran-ai-arm64.apk quran-ai-armv7-old-phones.apk \
            --prerelease --target "$GITHUB_SHA" --title "قرآن AI — أحدث نسخة أندرويد" \
            --notes "نسخة ${GITHUB_SHA::7} من فرع ${GITHUB_REF_NAME}.

          - quran-ai-arm64.apk: لأغلب الجوالات (منذ 2017 تقريبًا).
          - quran-ai-armv7-old-phones.apk: للجوالات القديمة 32-بت."

  ios:
    if: github.event_name == 'workflow_dispatch' && inputs.ios
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Unsigned: install it with a sideloading tool (e.g. Sideloadly or
      # AltStore) using your Apple ID, or sign it for TestFlight.
      - run: flutter build ios --release --no-codesign
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr quran-ai-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: quran-ai-ios-unsigned
          path: app/quran-ai-unsigned.ipa
          retention-days: 30

  # Windows desktop app, zipped. The tour also runs on the Windows runner as a
  # smoke test; its screenshots go to the ci-screenshots-windows branch.
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write  # publishes screenshots to ci-screenshots-windows
    defaults:
      run:
        working-directory: app
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build
        run: |
          # Native plugins print thousands of warnings; keep errors visible.
          flutter build windows --release 2>&1 | tee build.log || {
            grep -nE "error [A-Z]*[0-9]+|: error|Error:|FAILED" build.log | head -n 60
            exit 1
          }
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath quran-ai-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: quran-ai-windows
          path: app/quran-ai-windows.zip
          retention-days: 30
      - name: Screen tour on Windows
        id: tour
        run: |
          flutter drive --driver=test_driver/integration_test.dart \
            --target=integration_test/emulator_tour_test.dart -d windows \
            --dart-define=SCREENSHOT_DIR="$(cygpath -m "$PWD/screenshots")" 2>&1 | tee drive.log
      - name: Publish screenshots to the ci-screenshots-windows branch
        if: always() && hashFiles('app/screenshots/*.png') != ''
        working-directory: app/screenshots
        run: |
          git init -q
          git checkout -q -b ci-screenshots-windows
          git add .
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" \
            commit -qm "Windows screenshots for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots-windows
      - name: Check the tour passed
        if: always() && steps.tour.outcome != 'skipped'
        run: |
          tail -n 40 drive.log
          grep -q "All tests passed" drive.log

  # Runs integration_test/emulator_tour_test.dart on an Android emulator and
  # keeps the screenshots (also printed to the log as base64 JPEG).
  android-emulator:
    if: github.event_name == 'workflow_dispatch' && inputs.emulator
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write  # publishes screenshots to the ci-screenshots branch
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: app
      - name: Install Android NDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null
          "$SDKM" "ndk;29.0.13113456" > /dev/null
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          working-directory: app
          script: flutter drive --driver=test_driver/integration_test.dart --target=integration_test/emulator_tour_test.dart -d emulator-5554 2>&1 | tee drive.log
      # Screenshots go to an orphan branch so they can be viewed on GitHub
      # (or fetched with git) without downloading the artifact.
      - name: Publish screenshots to the ci-screenshots branch
        if: always()
        working-directory: app/screenshots
        run: |
          git init -q
          git checkout -q -b ci-screenshots
          git add .
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" \
            commit -qm "Emulator screenshots for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots
      - name: Check the tour passed
        if: always()
        working-directory: app
        run: |
          tail -n 40 drive.log
          grep -q "All tests passed" drive.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-screenshots
          path: app/screenshots/
          retention-days: 30
