name: Publish Lamsa Studio

# Copies studio/index.html to the gh-pages branch, which GitHub Pages serves at
# https://abdulrahmanahmedelabed-prog.github.io/quran-ai/
on:
  push:
    branches: [claude/sweet-einstein-xkxd23, claude/optimistic-lamport-1geo4k]
    paths: ["studio/**", ".github/workflows/studio-pages.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: studio-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push studio to gh-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          site="$(mktemp -d)"
          cp studio/index.html "$site/"
          touch "$site/.nojekyll"
          cd "$site"
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish Lamsa Studio from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
