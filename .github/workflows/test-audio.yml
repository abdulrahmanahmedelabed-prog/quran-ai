name: Test recitation audio

# Publishes a few recited ayahs as 16 kHz mono PCM16 to the data-test-audio
# branch, for measuring on-device recognition speed and accuracy offline.
on: workflow_dispatch

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download and convert
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          mkdir out && cd out
          fetch() {  # reciter surah first last name
            list=""
            for a in $(seq "$3" "$4"); do
              f=$(printf "%03d%03d.mp3" "$2" "$a")
              curl -sSfL -o "$f" "https://everyayah.com/data/$1/$f"
              list="$list|$f"
            done
            ffmpeg -loglevel error -i "concat:${list#|}" -ar 16000 -ac 1 -f s16le "$5.pcm"
            rm -f *.mp3
          }
          fetch Husary_128kbps 1 1 7 husary_fatiha
          fetch Husary_128kbps 2 1 5 husary_baqarah_1_5
          fetch Minshawy_Murattal_128kbps 112 1 4 minshawy_ikhlas
          fetch MaherAlMuaiqly128kbps 67 1 3 maher_mulk_1_3
          ls -l
      - name: Publish to the data-test-audio branch
        working-directory: out
        run: |
          git init -q
          git checkout -q -b data-test-audio
          git add .
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" \
            commit -qm "Test recitation audio"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" data-test-audio
