<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>استوديو لمسة</title>
<meta name="description" content="استوديو مجاني لتصميم الصور والفيديو يعمل من المتصفح مباشرة، دون تثبيت.">
<meta name="theme-color" content="#121015">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@400;700;900&family=Changa:wght@400;700;800&family=El+Messiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Lalezar&family=Marhey:wght@400;700&family=Noto+Kufi+Arabic:wght@400;700;900&family=Playfair+Display:wght@400;700;900&family=Reem+Kufi:wght@400;700&family=Scheherazade+New:wght@400;700&family=Tajawal:wght@400;500;700;900&display=swap">
<style>
/* Layout: editor shell. Tool rail and tool panel on the reading (right) side, stage in the centre, properties opposite; on phones the stage sits over a sheet with a bottom tab bar. */
:root{
  --ink:#121015; --panel:#19161d; --raise:#231f28; --line:#302a35; --fg:#f2ece2; --muted:#a0969d;
  --gold:#d4b06a; --gold-hi:#f0d79c; --on-gold:#1a1408; --danger:#e57361; --stage:#0b090d; --dot:#1c1820;
  --f-display:"Reem Kufi","Noto Kufi Arabic",serif;
  --f-body:"IBM Plex Sans Arabic","Tajawal",system-ui,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){ --ink:#e9e7ec; --panel:#fbfafc; --raise:#f0eef3; --line:#dcd8e1; --fg:#1d1a21; --muted:#665f6c;
    --gold:#94702f; --gold-hi:#7a5a1f; --on-gold:#fffaf0; --danger:#b8442f; --stage:#d7d3db; --dot:#c9c4ce; color-scheme:light }
}
:root[data-theme="light"]{ --ink:#e9e7ec; --panel:#fbfafc; --raise:#f0eef3; --line:#dcd8e1; --fg:#1d1a21; --muted:#665f6c;
  --gold:#94702f; --gold-hi:#7a5a1f; --on-gold:#fffaf0; --danger:#b8442f; --stage:#d7d3db; --dot:#c9c4ce; color-scheme:light }
:root[data-theme="dark"]{ --ink:#121015; --panel:#19161d; --raise:#231f28; --line:#302a35; --fg:#f2ece2; --muted:#a0969d;
  --gold:#d4b06a; --gold-hi:#f0d79c; --on-gold:#1a1408; --danger:#e57361; --stage:#0b090d; --dot:#1c1820; color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--fg);font:14px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

.app{height:100%;display:grid;grid-template-columns:76px 300px minmax(0,1fr) 312px;grid-template-rows:58px minmax(0,1fr) auto;
  grid-template-areas:"top top top top" "rail tools stage props" "rail tools time props"}

/* top bar */
.top{grid-area:top;display:flex;align-items:center;gap:10px;padding-inline:16px;background:var(--panel);border-bottom:1px solid var(--line);min-width:0}
.brand{display:flex;align-items:center;gap:10px;margin-inline-end:auto;min-width:0}
.brand svg{width:30px;height:30px;flex:none}
.brand b{font:700 23px/1 var(--f-display);color:var(--gold)}
.brand small{color:var(--muted);font-size:12px;white-space:nowrap}
.top select{max-width:220px;min-width:0;padding:7px 10px;border-radius:10px;border:1px solid var(--line);background:var(--raise)}
.ibtn{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--raise);color:var(--fg);padding:0;flex:none}
.ibtn:disabled{opacity:.35;cursor:default}
.ibtn.sm{width:32px;height:32px;border-radius:8px}
.ibtn.sm svg.i{width:17px;height:17px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--raise);color:var(--fg);font-weight:500;text-align:center}
.btn:hover,.ibtn:hover:not(:disabled){border-color:color-mix(in srgb,var(--gold) 55%,var(--line))}
.btn.gold{background:var(--gold);color:var(--on-gold);border-color:transparent;font-weight:600}
.btn.gold:hover{background:var(--gold-hi);color:var(--on-gold)}
.btn.block{width:100%}
.btn.danger{color:var(--danger)}

/* rail */
.rail{grid-area:rail;display:flex;flex-direction:column;gap:4px;padding:10px 8px;background:var(--panel);border-inline-end:1px solid var(--line);overflow:auto}
.rail button{display:grid;justify-items:center;gap:4px;padding:10px 2px 8px;border:0;border-radius:12px;background:none;color:var(--muted);font-size:11.5px;line-height:1.2}
.rail button[aria-current="true"]{background:var(--raise);color:var(--gold)}
.rail button:hover{color:var(--fg)}
.rail .only-m{display:none}

/* panels */
.panel{background:var(--panel);overflow:auto;padding:4px 16px 40px;min-width:0}
.tools{grid-area:tools;border-inline-end:1px solid var(--line)}
.props{grid-area:props;border-inline-start:1px solid var(--line)}
.ptitle{font:700 18px/1.3 var(--f-display);margin:16px 0 4px;color:var(--fg)}
.psub{margin:0 0 4px;color:var(--muted);font-size:12.5px}
.sec{display:grid;gap:12px;padding-block:16px;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.sec>h3{margin:0;font-size:12.5px;font-weight:600;color:var(--muted)}
.ctl{display:grid;gap:6px;min-width:0}
.ctl>label{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px}
.ctl output{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px}
input[type=range]{width:100%;accent-color:var(--gold);margin:0;direction:ltr}
input[type=color]{width:40px;height:30px;padding:0;border:1px solid var(--line);border-radius:8px;background:none;flex:none}
input[type=number],input[type=text],select,textarea{width:100%;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--raise)}
textarea{resize:vertical;min-height:84px;line-height:1.6}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.colrow{display:flex;gap:10px;align-items:center}
.sw{display:flex;flex-wrap:wrap;gap:5px}
.sw button{width:20px;height:20px;border-radius:50%;border:1px solid var(--line);background:var(--c);padding:0}
.seg{display:flex;flex-wrap:wrap;gap:3px;padding:3px;border-radius:11px;background:var(--raise)}
.seg button{flex:1 1 auto;padding:6px 8px;border:0;border-radius:8px;background:none;color:var(--muted);font-size:12.5px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--gold);box-shadow:0 0 0 1px var(--line)}
.tog{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;cursor:pointer}
.tog input{appearance:none;width:38px;height:22px;border-radius:22px;background:var(--line);position:relative;margin:0;cursor:pointer;flex:none;transition:background .15s}
.tog input::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:16px;height:16px;border-radius:50%;background:var(--fg);transition:inset-inline-start .15s}
.tog input:checked{background:var(--gold)}
.tog input:checked::after{inset-inline-start:19px;background:var(--on-gold)}
.hint{margin:0;color:var(--muted);font-size:12.5px;line-height:1.7}
.note{padding:10px 12px;border-radius:10px;background:var(--raise);color:var(--muted);font-size:12.5px;line-height:1.7}

/* cards */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.card{display:grid;gap:6px;padding:8px;border-radius:12px;border:1px solid var(--line);background:var(--raise);text-align:start;min-width:0}
.card:hover{border-color:var(--gold)}
.card canvas,.card .thumb{width:100%;aspect-ratio:1;object-fit:contain;border-radius:8px;background:var(--stage);display:block}
.card span{font-weight:600;font-size:13px}
.card small{color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums}
.style-card{min-height:84px;display:grid;place-items:center;padding:10px 6px;border-radius:12px;border:1px solid var(--line);background:#141116;color:#fff;font-size:24px;line-height:1.2;overflow:hidden}
.style-card:hover{border-color:var(--gold)}
.shape-btn{aspect-ratio:1;display:grid;place-items:center;border-radius:12px;border:1px solid var(--line);background:var(--raise);padding:6px}
.shape-btn:hover{border-color:var(--gold)}
.shape-btn canvas{width:100%;height:100%}
.fonts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.fonts button{padding:8px 6px;border-radius:10px;border:1px solid var(--line);background:var(--raise);font-size:17px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fonts button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
.grads{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.grads button{aspect-ratio:1;border-radius:10px;border:1px solid var(--line);background:var(--g);padding:0}
.media-thumb{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--stage);padding:0}
.media-thumb img,.media-thumb video{width:100%;height:100%;object-fit:cover;display:block}
.ai-res{display:grid;gap:6px;padding:6px;border-radius:12px;border:1px solid var(--line);background:var(--raise)}
.ai-res img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;display:block;background:var(--stage)}
.ai-res .row2 .btn{padding:6px 8px;font-size:12.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{padding:5px 10px;border-radius:20px;border:1px solid var(--line);background:var(--raise);font-size:12.5px;color:var(--muted)}
.chips button:hover{color:var(--fg);border-color:var(--gold)}
.busy{display:flex;align-items:center;gap:10px}
.busy i{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--gold);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.media-thumb em{position:absolute;inset-inline-start:4px;bottom:4px;font-style:normal;font-size:10.5px;padding:1px 6px;border-radius:6px;background:rgb(0 0 0 / .6);color:#fff}

/* layers list */
.layers{display:grid;gap:6px}
.layer{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:10px;border:1px solid var(--line);background:var(--raise);min-width:0}
.layer[aria-selected="true"]{border-color:var(--gold)}
.layer .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:none;border:0;text-align:start;padding:4px 0}
.layer .ibtn{width:28px;height:28px;border-radius:7px;background:none;border-color:transparent}
.layer .ibtn svg.i{width:16px;height:16px}
.layer .ty{color:var(--gold);display:grid}
.phead{display:flex;align-items:center;gap:10px;padding-block:14px 12px;border-bottom:1px solid var(--line)}
.phead>div:first-child{flex:1;min-width:0;display:grid}
.phead small{color:var(--muted);font-size:12px}
.phead strong{font:700 16px/1.3 var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acts{display:flex;gap:6px}

/* stage */
.stage{grid-area:stage;position:relative;display:grid;place-items:center;overflow:hidden;background-color:var(--stage);
  background-image:radial-gradient(var(--dot) 1px,transparent 1.2px);background-size:22px 22px;touch-action:none}
.stage canvas{display:block;box-shadow:0 24px 70px rgb(0 0 0 / .45),0 0 0 1px rgb(255 255 255 / .06);touch-action:none;cursor:default}
.stage.drop::after{content:"أفلت الملفات هنا";position:absolute;inset:16px;display:grid;place-items:center;border:2px dashed var(--gold);border-radius:18px;background:rgb(0 0 0 / .45);color:#fff;font:700 22px var(--f-display)}
.zoomtag{position:absolute;bottom:10px;inset-inline-start:12px;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;pointer-events:none}

/* timeline */
.time{grid-area:time;background:var(--panel);border-top:1px solid var(--line);padding:8px 16px 10px;display:grid;gap:6px;min-width:0}
.tbar{display:flex;align-items:center;gap:10px;direction:ltr;min-width:0}
.tbar .play{width:40px;height:40px;border-radius:50%;background:var(--gold);color:var(--on-gold);border:0}
.tbar .play svg.i{width:18px;height:18px}
.tbar .tc{font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--muted);white-space:nowrap}
.tbar input[type=range]{flex:1;min-width:60px}
.tbar label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);direction:rtl;white-space:nowrap}
.tbar input[type=number]{width:64px;padding:5px 6px}
.tracks{position:relative;direction:ltr;display:grid;gap:3px;max-height:66px;overflow:auto}
.track{position:relative;height:12px;border-radius:4px;background:var(--raise);cursor:pointer;border:0;padding:0;width:100%}
.track i{position:absolute;top:2px;bottom:2px;border-radius:3px;background:color-mix(in srgb,var(--gold) 45%,var(--raise))}
.track[aria-selected="true"] i{background:var(--gold)}
.playhead{position:absolute;top:0;bottom:0;width:2px;background:var(--fg);pointer-events:none;opacity:.7}

/* modal + toast */
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgb(0 0 0 / .55)}
.sheet{width:min(480px,100%);max-height:100%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;display:grid;gap:16px}
.sheet header{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sheet h2{margin:0;font:700 20px/1.3 var(--f-display)}
.exgrid{display:grid;gap:8px}
.exopt{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--raise);text-align:start;width:100%}
.exopt:hover{border-color:var(--gold)}
.exopt span{display:grid;flex:1}
.exopt b{font-weight:600}
.exopt small{color:var(--muted);font-size:12px}
.exopt svg.i{color:var(--gold)}
.progress{height:8px;border-radius:8px;background:var(--raise);overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--gold);transition:width .2s linear}
.toast{position:fixed;z-index:60;inset-inline:0;margin-inline:auto;bottom:calc(24px + env(safe-area-inset-bottom,0px));width:max-content;max-width:calc(100% - 32px);
  padding:10px 16px;border-radius:12px;background:var(--fg);color:var(--ink);font-weight:500;box-shadow:0 10px 30px rgb(0 0 0 / .3);transition:opacity .2s,transform .2s}
.toast[data-hide]{opacity:0;transform:translateY(8px);pointer-events:none}
.pool{position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;overflow:hidden;inset-inline-start:0;top:0}

@media (max-width: 959px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:54px minmax(0,1fr) auto minmax(0,42%) auto;
    grid-template-areas:"top" "stage" "time" "tools" "rail"}
  .props{grid-area:tools;border:0}
  .tools{border:0}
  .app:not(.show-props) .props{display:none}
  .app.show-props .tools{display:none}
  .rail{flex-direction:row;gap:2px;padding:4px 6px;border-inline-end:0;border-top:1px solid var(--line);overflow-x:auto}
  .rail button{flex:1 0 54px;padding:7px 2px 6px;font-size:10.5px}
  .rail .only-m{display:grid}
  .top{padding-inline:12px;gap:8px}
  .brand small,.hide-m{display:none}
  .top select{max-width:150px;font-size:12.5px;padding:6px 8px}
  .ibtn{width:34px;height:34px}
  .time{padding:6px 12px 8px}
  .tracks{display:none}
  .grid2{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
  .fonts{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
}
@media (max-width: 440px){ #exportBtn span{display:none} #exportBtn{padding:8px 10px} .brand b{font-size:20px} }
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6e3a1"/><stop offset=".55" stop-color="#c99a3d"/><stop offset="1" stop-color="#8c6421"/></linearGradient></defs>
        <g fill="none" stroke="url(#lg)" stroke-width="1.8"><rect x="7" y="7" width="18" height="18"/><rect x="7" y="7" width="18" height="18" transform="rotate(45 16 16)"/></g><circle cx="16" cy="16" r="3" fill="url(#lg)"/></svg>
      <b>لمسة</b><small>استوديو الصور والفيديو</small>
    </div>
    <select id="sizeSel" aria-label="مقاس التصميم"></select>
    <button class="ibtn" id="undoBtn" title="تراجع (Ctrl+Z)" aria-label="تراجع"></button>
    <button class="ibtn" id="redoBtn" title="إعادة (Ctrl+Y)" aria-label="إعادة"></button>
    <button class="btn gold" id="exportBtn"></button>
  </header>

  <nav class="rail" id="rail" aria-label="الأدوات"></nav>
  <aside class="panel tools" id="tools" aria-label="لوحة الأدوات"></aside>

  <main class="stage" id="stage">
    <canvas id="cv" width="1080" height="1080" aria-label="مساحة التصميم"></canvas>
    <span class="zoomtag" id="zoomTag"></span>
  </main>

  <section class="time" aria-label="الخط الزمني">
    <div class="tbar">
      <button class="play" id="playBtn" aria-label="تشغيل المعاينة"></button>
      <span class="tc" id="tcur">0:00.0</span>
      <input type="range" id="scrub" min="0" max="6" step="0.01" value="0" aria-label="الوقت">
      <span class="tc" id="tdur">0:06.0</span>
      <label class="hide-m" for="durIn">المدة (ث)<input type="number" id="durIn" min="1" max="600" step="0.5" value="6"></label>
    </div>
    <div class="tracks" id="tracks"></div>
  </section>

  <aside class="panel props" id="props" aria-label="خصائص العنصر"></aside>
</div>

<div class="modal" id="exportModal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="exTitle">
    <header><h2 id="exTitle">تصدير التصميم</h2><button class="ibtn sm" id="exClose" aria-label="إغلاق"></button></header>
    <div id="exChoose" class="exgrid">
      <div class="ctl"><label><span>دقة الصورة</span></label><div class="seg" id="exScale"></div></div>
      <button class="exopt" data-fmt="png"><span><b>صورة PNG</b><small>أعلى جودة، مناسبة للطباعة والشعارات</small></span></button>
      <button class="exopt" data-fmt="jpg"><span><b>صورة JPG</b><small>حجم أصغر للنشر السريع</small></span></button>
      <button class="exopt" data-fmt="video"><span><b id="exVidName">فيديو</b><small id="exVidSub"></small></span></button>
      <p class="hint" id="exNote"></p>
    </div>
    <div id="exProg" class="exgrid" hidden>
      <p class="hint" id="exProgTxt">جارِ تسجيل الفيديو… ابقَ في هذه الصفحة حتى ينتهي.</p>
      <div class="progress"><i id="exBar"></i></div>
      <button class="btn" id="exCancel">إلغاء التصدير</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" data-hide role="status" aria-live="polite"></div>
<div class="pool" id="pool" aria-hidden="true"></div>
<input type="file" id="fileIn" hidden>

<script>
'use strict';
document.documentElement.lang = 'ar';
document.documentElement.dir = 'rtl';

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const DEG = Math.PI / 180;
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const uid = () => Math.random().toString(36).slice(2, 10);
const easeOut = p => 1 - Math.pow(1 - p, 3);
const backOut = p => { const c = 1.9; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
const isAr = s => /[؀-ۿݐ-ݿﭐ-﷿ﹰ-﻿]/.test(s || '');
const fmtT = t => `\u2066${Math.floor(t / 60)}:${(t % 60).toFixed(1).padStart(4, '0')}\u2069`;
const dim = (w, hh) => `\u2066${w}×${hh}\u2069`;

    for (const s of [-180, -90, 0, 90, 180]) if (Math.abs(a - s) < 4) a = s;
    l.rot = Math.round(a);
  } else if (drag.mode === 'c') {
    const lp = toLocal(l, p);
    if (l.type === 'shape') { l.w = Math.max(4, Math.abs(lp.x) * 2); l.h = Math.max(2, Math.abs(lp.y) * 2); }
    else {
      const f = Math.max(.05, Math.hypot(lp.x, lp.y) / drag.d0);
      if (l.type === 'text') { l.size = clamp(drag.s0 * f, 6, 2000); if (l.box.on) l.box.pad = drag.pad0 * f; }
      else { l.w = Math.max(8, drag.w0 * f); l.h = Math.max(8, drag.h0 * f); }
    }
  } else if (drag.mode === 'e') {
    const lp = toLocal(l, p);
    if (drag.hd.sx) l.w = Math.max(4, Math.abs(lp.x) * 2); else l.h = Math.max(2, Math.abs(lp.y) * 2);
  }
  requestDraw();
});
function endPointer(e) {
  pointers.delete(e.pointerId);
  if (drag && (pointers.size === 0 || drag.mode === 'pinch')) {
    if (moved) { commit(); renderProps(); }
    else if (drag.mode === 'move' && mq.matches && tab !== 'props') setTab('props');
    drag = null; guides = []; requestDraw();
  }
}
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', endPointer);
cv.addEventListener('dblclick', e => {
  const l = cur(); if (!l || l.type !== 'text') return;
  if (mq.matches) setTab('props');
  const ta = $('#textEdit'); if (ta) { ta.focus(); ta.select(); }
});
$('#stage').addEventListener('pointerdown', e => { if (e.target === $('#stage') && !exporting) { if (playing) pause(); animPreview = false; select(null); } });
cv.addEventListener('wheel', e => {
  const l = cur(); if (!l || l.locked || !(e.ctrlKey || e.altKey)) return;
  e.preventDefault(); const f = Math.exp(-e.deltaY * .002);
  if (l.type === 'text') l.size = clamp(l.size * f, 6, 2000); else { l.w *= f; l.h *= f; }
  requestDraw(); clearTimeout(changedTimer); changedTimer = setTimeout(() => { commit(); renderProps(); }, 300);
}, { passive: false });

/* drag & drop, paste */
const stageEl = $('#stage');
stageEl.addEventListener('dragover', e => { e.preventDefault(); stageEl.classList.add('drop'); });
stageEl.addEventListener('dragleave', e => { if (e.target === stageEl) stageEl.classList.remove('drop'); });
stageEl.addEventListener('drop', e => { e.preventDefault(); stageEl.classList.remove('drop'); if (e.dataTransfer.files.length) addFiles([...e.dataTransfer.files]); });
document.addEventListener('paste', e => {
  const files = [...(e.clipboardData && e.clipboardData.items) || []].filter(i => i.kind === 'file').map(i => i.getAsFile()).filter(Boolean);
  if (files.length) { e.preventDefault(); addFiles(files); }
});

/* keyboard */
let nudgeTimer = 0;
addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input,textarea,select')) return;
  if (!$('#exportModal').hidden) { if (e.key === 'Escape') closeExport(); return; }
  const l = cur(), mod = e.ctrlKey || e.metaKey;
  if (mod && e.code === 'KeyZ') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
  else if (mod && e.code === 'KeyY') { e.preventDefault(); redo(); }
  else if (mod && e.code === 'KeyD') { e.preventDefault(); duplicate(); }
  else if ((e.key === 'Delete' || e.key === 'Backspace') && l) { e.preventDefault(); removeSel(); }
  else if (e.key.startsWith('Arrow') && l && !l.locked) {
    e.preventDefault(); const d = e.shiftKey ? 10 : 1;
    if (e.key === 'ArrowLeft') l.x -= d; if (e.key === 'ArrowRight') l.x += d; if (e.key === 'ArrowUp') l.y -= d; if (e.key === 'ArrowDown') l.y += d;
    requestDraw(); clearTimeout(nudgeTimer); nudgeTimer = setTimeout(commit, 400);
  }
  else if (e.code === 'Space' && !e.target.closest('button')) { e.preventDefault(); playing ? pause() : play(); }
  else if (e.key === 'Escape') select(null);
});

/* ---------- toast ---------- */
let toastTimer = 0;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.removeAttribute('data-hide'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.setAttribute('data-hide', ''), 2800); }

/* ---------- export modal wiring ---------- */
$('#exportBtn').append(icon('download'), h('span', {}, 'تصدير'));
$('#undoBtn').append(icon('undo')); $('#redoBtn').append(icon('redo')); $('#exClose').append(icon('close'));
$('#undoBtn').addEventListener('click', undo); $('#redoBtn').addEventListener('click', redo);
$('#exportBtn').addEventListener('click', openExport);
$('#exClose').addEventListener('click', closeExport);
$('#exportModal').addEventListener('click', e => { if (e.target.id === 'exportModal') closeExport(); });
document.querySelectorAll('.exopt').forEach(b => {
  b.prepend(icon(b.dataset.fmt === 'video' ? 'video' : 'image'));
  b.addEventListener('click', () => { if (b.dataset.fmt === 'video') exportVideo(); else exportImage(b.dataset.fmt); });
});
const exs = { s: 1 };
$('#exScale').replaceWith(ctlSeg(null, exs, 's', [[1, 'أصلية'], [2, 'مضاعفة ×2']], () => { exScale = exs.s; }).querySelector('.seg'));
$('#exCancel').addEventListener('click', () => { exCancelled = true; onPlayEnd = null; if (playing) pause(); if (rec && rec.state !== 'inactive') rec.stop(); });

/* ---------- boot ---------- */
function renderAll() { renderRail(); renderTools(); renderProps(); renderTracks(); updateTime(); updateUndo(); requestDraw(); }
mq.addEventListener('change', () => { if (!mq.matches && tab === 'props') tab = 'templates'; $('#app').classList.toggle('show-props', tab === 'props'); renderRail(); renderTools(); fitCanvas(); });
updatePlayBtn();
loadDoc(TEMPLATES[0].make()); commit();
if (document.fonts) {
  Promise.all(FONTS.map(([f]) => document.fonts.load(`700 40px "${f}"`, f === 'Playfair Display' ? 'Ab' : 'أبجد').catch(() => {}))).then(() => { requestDraw(); if (tab === 'templates') renderTools(); });
  document.fonts.addEventListener && document.fonts.addEventListener('loadingdone', requestDraw);
}
store.load().then(ok => { if (ok) { hist = []; hi = -1; commit(); toast('استعدنا آخر تصميم عملت عليه.'); } })
  .catch(() => {}).finally(() => { booted = true; store.saveSoon(); });
</script>
</body>
